name: CI

# Pull requests run it here. Pushes to main and next run it from release.yml, which waits for
# it before versioning or publishing, so a push is built and tested once.
on:
  pull_request:
    branches: [main, next]
  workflow_call:

permissions:
  contents: read
  packages: read
  actions: read

# Its own prefix: called from release.yml, `github.workflow` is the caller's name, and sharing
# the caller's group would leave each run waiting on the other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # All dependencies resolve from public npm, no registry auth needed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - name: Build affected
        run: pnpm nx affected -t build --parallel=3
        env:
          NODE_ENV: production

      - name: Test affected
        run: pnpm nx affected -t test --parallel=3

      - name: Typecheck affected
        run: pnpm nx affected -t typecheck --parallel=3
